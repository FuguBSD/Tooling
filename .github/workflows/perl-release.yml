name: "Perl: Release"

# Reusable release workflow for the FuguBSD Perl distributions. A
# consumer calls it from its own release.yml on a push of a
# v<MAJOR>.<MINOR>.<PATCH> tag. The workflow runs in the caller's
# repository: the checkout, the tests, the dist build, and the release
# steps all operate on the caller's tree.
#
# The `tag` input serves a caller that dispatches instead of pushing.
# An environment that cannot push a tag makes the tag inside a
# workflow, and GitHub raises no push event for a tag that
# GITHUB_TOKEN pushes, so no push starts this workflow. Such a caller
# names the tag, and this workflow checks out that tag and reads the
# version from it. Without the input the workflow reads the ref of the
# push, as before.
#
# The job binds the caller's `release` environment, which holds the
# PAUSE_USERNAME and PAUSE_PASSWORD secrets. The caller must pass
# `secrets: inherit` and must keep `permissions: contents: write`.
# The PAUSE upload only runs when the caller sets `pause: true`.

on:
  workflow_call:
    inputs:
      dist:
        description: "The distribution name, e.g. App-FuguVM"
        required: true
        type: string
      name:
        description: "The display name for the release title, e.g. FuguVM"
        required: true
        type: string
      install-note:
        description: "An extra installation paragraph for the release body"
        required: false
        type: string
        default: ""
      assets:
        description: "Extra files under build/ to attach, whitespace-separated"
        required: false
        type: string
        default: ""
      pause:
        description: "Upload the tarball to PAUSE"
        required: false
        type: boolean
        default: false
      tag:
        description: "The release tag, for a caller that dispatches"
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # An empty ref keeps the default, which is the ref of the
          # push. A caller that dispatches names the tag instead.
          ref: ${{ inputs.tag }}

      - name: Setup Perl
        uses: FuguBSD/Tooling/perl/actions/setup-perl@main
        with:
          dependencies: test

      - name: Run tests
        run: make test

      - name: Derive the version from the tag
        id: version
        env:
          # The input wins, and the ref of the push is the default.
          # Both reach the shell through the environment, so neither
          # one can become part of the script.
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_REF}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release: tag '$tag' is not v<MAJOR>.<MINOR>.<PATCH>" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Each value reaches the script through the environment, as
      # the signing step below does. A caller names the
      # distribution, and a name in the script text becomes part of
      # a command.
      #
      # Every name here carries the DIST_ prefix, because mk/perl.mk
      # reads DIST and VERSION. WFL-ACTIONS-4 states the rule.
      - name: Build the distribution tarball
        env:
          DIST_NAME: ${{ inputs.dist }}
          DIST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          make dist VERSION="$DIST_VERSION"
          # The stable name serves releases/latest/download/<dist>.tar.gz,
          # the URL that the deps manifests of the consumers name.
          cp "build/$DIST_NAME-$DIST_VERSION.tar.gz" \
            "build/$DIST_NAME.tar.gz"

      # A caller can name a list of files for the release, and
      # make dist of the caller writes each one under build/. This
      # step reads the names before the signing step reads the key,
      # so a bad name and an absent file both stop the run before a
      # secret is in the environment of any step.
      #
      # Every name here carries the DIST_ prefix, as the build step
      # above does. WFL-ACTIONS-9 states the rule.
      - name: Check the release assets
        id: assets
        shell: bash
        env:
          DIST_NAME: ${{ inputs.dist }}
          DIST_VERSION: ${{ steps.version.outputs.version }}
          DIST_ASSETS: ${{ inputs.assets }}
        run: |
          # The input is a whitespace-separated list, so the word
          # split of the shell reads it. set -f turns pathname
          # expansion off, so each loop below reads the words of the
          # input. A glob that expands first passes as the file that
          # it matches. seen holds each name that the loop took
          # already.
          set -f
          seen=""
          # shellcheck disable=SC2086
          for name in $DIST_ASSETS; do
            # A plain file name and nothing else: a letter, a
            # digit, a period, a hyphen and an underscore. One
            # positive rule refuses whitespace, a parenthesis, a /
            # and a glob character together. The manifest names a
            # file and never a path. The release publishes the bare
            # name, and a download keeps it. tar and unzip read a
            # leading hyphen as an option, as FuguBench
            # DEPS-INSTALL-8 states.
            case "$name" in
              -* | *[!A-Za-z0-9._-]*)
                echo "release: the asset name is no plain file" \
                  "name: $name" >&2
                exit 1 ;;
            esac

            # The release makes these four files itself. A caller
            # that names one of them gives the manifest a second
            # line, and the release a second upload of one name.
            case "$name" in
              SHA256 | SHA256.sig \
                | "$DIST_NAME-$DIST_VERSION.tar.gz" \
                | "$DIST_NAME.tar.gz")
                echo "release: the release makes build/$name" \
                  "itself" >&2
                exit 1 ;;
            esac

            # gh release create refuses a second upload of one
            # name, so the release breaks on a repeat. The rule
            # above holds each name to a plain file name, so this
            # match is a literal one.
            case " $seen " in
              *" $name "*)
                echo "release: the assets input names build/$name" \
                  "twice" >&2
                exit 1 ;;
            esac
            seen="$seen $name"

            if [ ! -f "build/$name" ]; then
              echo "release: build/$name is absent" >&2
              exit 1
            fi
          done

          # The release step takes one list: the two tarballs, and
          # then each asset. A caller that names no asset gets the
          # two tarballs alone.
          {
            echo 'files<<END_OF_LIST'
            echo "build/$DIST_NAME-$DIST_VERSION.tar.gz"
            echo "build/$DIST_NAME.tar.gz"
            # shellcheck disable=SC2086
            for name in $DIST_ASSETS; do
              echo "build/$name"
            done
            echo 'END_OF_LIST'
          } >> "$GITHUB_OUTPUT"

      # The signify tier of the fugubench deps verb reads a manifest
      # beside the download, and it keys that manifest on the file
      # name. A consumer can name the versioned tarball or the stable
      # one, so the manifest holds both.
      #
      # The install runs in its own step, before a secret is in the
      # environment of any step. An unpinned package install must not
      # run beside a private key.
      - name: Install signify
        if: vars.RELENG_RELEASE_SLOT != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes signify-openbsd

      # The release key lives in one of two organization secrets, and
      # an organization variable names the active slot. A step that
      # named one fixed secret could not rotate without a human.
      #
      # The organization names no slot until FuguBSD/Website publishes
      # the first key. A release then carries no signature, and it
      # still releases. A slot that names an empty secret is a
      # different thing: that is a release that was meant to be
      # signed, so it fails.
      - name: Sign the release assets
        id: sign
        shell: bash
        env:
          SLOT: ${{ vars.RELENG_RELEASE_SLOT }}
          KEY_A: ${{ secrets.RELENG_RELEASE_KEY_A }}
          KEY_B: ${{ secrets.RELENG_RELEASE_KEY_B }}
          DIST_NAME: ${{ inputs.dist }}
          DIST_VERSION: ${{ steps.version.outputs.version }}
          DIST_ASSETS: ${{ inputs.assets }}
        run: |
          set -o pipefail

          # The name guard runs first. A release with no slot signs
          # nothing, and a name that no manifest can carry is still a
          # name that a later release would sign.
          case "$DIST_NAME" in
            *[[:space:]\(\)]*)
              echo "release: the dist name holds whitespace or a" \
                "parenthesis: $DIST_NAME" >&2
              exit 1 ;;
          esac

          if [ -z "$SLOT" ]; then
            echo "release: the organization names no key slot," \
              "so this release carries no signature"
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$SLOT" in
            A) key="$KEY_A" ;;
            B) key="$KEY_B" ;;
            *) echo "release: RELENG_RELEASE_SLOT is '$SLOT'," \
                 "and the slots are A and B" >&2
               exit 1 ;;
          esac

          if [ -z "$key" ]; then
            echo "release: slot $SLOT names no key" >&2
            exit 1
          fi

          # The key file goes with the step, whatever the outcome. A
          # failure below must leave no key for the steps that follow.
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077

          # signify(1) refuses a key file with no final newline.
          printf '%s\n' "$key" > "$work/release.sec"

          # The manifest names a file and never a path, because one
          # release directory holds unique names. Each digest is read
          # on its own, so no field of a sha256sum line has to survive
          # a split.
          : > build/SHA256
          # The check step above held each asset name to the guard,
          # so the word split here takes a name that the manifest
          # carries. That guard leaves no glob character, so pathname
          # expansion finds nothing here. An empty list adds no line.
          # shellcheck disable=SC2086
          for name in "$DIST_NAME-$DIST_VERSION.tar.gz" \
            "$DIST_NAME.tar.gz" $DIST_ASSETS; do
            digest=$(sha256sum "build/$name" | sed 's|^\\||' \
              | cut -d' ' -f1)
            case "$digest" in
              [0-9a-f]*) ;;
              *) echo "release: cannot digest build/$name" >&2
                 exit 1 ;;
            esac
            printf 'SHA256 (%s) = %s\n' "$name" "$digest" >> build/SHA256
          done
          sort -o build/SHA256 build/SHA256

          signify-openbsd -S -s "$work/release.sec" \
            -m build/SHA256 -x build/SHA256.sig

          # The consumer verifies the signature against the published
          # key, which this workflow does not hold. The manifest is
          # public, so the log can carry it.
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          cat build/SHA256

      - name: Keep the tarball as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dist }}-${{ steps.version.outputs.version }}
          path:
            build/${{ inputs.dist }}-${{ steps.version.outputs.version }}.tar.gz

      - name: Release to GitHub
        uses: FuguBSD/Tooling/actions/gh-release@main
        with:
          tag: ${{ steps.version.outputs.tag }}
          title: ${{ inputs.name }} ${{ steps.version.outputs.version }}
          files: |
            ${{ steps.assets.outputs.files }}
            ${{ steps.sign.outputs.signed == 'yes' && 'build/SHA256' || '' }}
            ${{ steps.sign.outputs.signed == 'yes' && 'build/SHA256.sig' || '' }}
          token: ${{ github.token }}
          body: |
            ## Installation

            ${{ inputs.install-note }}

            ```sh
            cpanm --notest ${{ inputs.dist }}-${{ steps.version.outputs.version }}.tar.gz
            ```

            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for full instructions.

      - name: Release to PAUSE
        if: inputs.pause
        uses: FuguBSD/Tooling/perl/actions/pause-upload@main
        with:
          file:
            build/${{ inputs.dist }}-${{ steps.version.outputs.version }}.tar.gz
          username: ${{ secrets.PAUSE_USERNAME }}
          password: ${{ secrets.PAUSE_PASSWORD }}
