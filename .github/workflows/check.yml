name: Check

# The gate of the Tooling repository itself. Everything here is the
# tooling of every consumer, so every push checks all of it: no paths
# filter.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./perl/actions/setup-perl
        with:
          dependencies: test

      - name: Setup uv
        uses: ./python/actions/setup-uv

      - name: Setup bun
        uses: ./actions/setup-bun

      - name: Check the formatting
        run: make format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./perl/actions/setup-perl
        with:
          dependencies: test

      - name: Setup uv
        uses: ./python/actions/setup-uv

      - name: Lint the sources
        run: make lint

  lock:
    name: Lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: ./python/actions/setup-uv

      - name: Check the lockfile
        run: make lock-py

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./perl/actions/setup-perl
        with:
          dependencies: test

      - name: Run tests
        run: make test

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      # The gate scans the git history, so the checkout must be full
      # (WFL-GITLEAKS-2). A shallow checkout hides old commits.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup gitleaks
        uses: ./actions/setup-gitleaks

      - name: Scan for secrets
        run: make gitleaks

  spec:
    name: Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the specification
        run: make spec-check

      - name: Check the prose
        run: make ste-lint

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run:
          org/sync/scripts/spec-check --root . --drift "origin/${{
          github.base_ref }}"
