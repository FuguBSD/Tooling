name: Check

# The gate of the Tooling repository itself. Everything here is the
# tooling of every consumer, so every push checks all of it: no paths
# filter.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown, JSON and YAML formatting
        run: make prettier

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./perl/actions/setup-perl
        with:
          dependencies: test

      - name: Check Perl formatting
        run: make tidy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./perl/actions/setup-perl
        with:
          dependencies: test

      - name: Lint Perl sources
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./perl/actions/setup-perl
        with:
          dependencies: test

      - name: Run tests
        run: make test

  spec:
    name: Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the specification
        run: make spec-check

      - name: Check the prose
        run: make ste-lint

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run:
          org/sync/scripts/spec-check --root . --drift "origin/${{
          github.base_ref }}"
