name: Setup gitleaks
description:
  Install a pinned gitleaks release. A CI job runs this action before the
  gitleaks gate (MK-GITLEAKS), and the checksum pins the exact binary
  (WFL-GITLEAKS-1).

inputs:
  version:
    description: The gitleaks version to install.
    required: false
    default: "8.30.1"
  checksum:
    description: The sha256 checksum of the linux_x64 release tarball.
    required: false
    default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

runs:
  using: composite
  steps:
    # A pinned release tarball, not a third-party action. CI uses no
    # third-party action, and perl/t/setup-perl.t enforces it here.
    # The checksum check stops a changed download: this binary reads
    # every secret finding.
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
        GITLEAKS_SHA256: ${{ inputs.checksum }}
      run: |
        # Fail closed. Fail first. A malformed version composes a
        # download URL that returns an error page, not a tarball, and
        # tar would fail many lines from the cause.
        case "$GITLEAKS_VERSION" in
        *[!0-9.]* | "")
          echo "setup-gitleaks: '$GITLEAKS_VERSION' is not a release number" >&2
          exit 1
          ;;
        esac

        curl -LsSf \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o /tmp/gitleaks.tar.gz
        echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        mkdir -p "$HOME/.local/bin"
        install -m 755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
